name: Atlas CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build & Test Maven Reactor
        run: mvn clean test -B

      - name: Set up Node.js for UI
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build React UI
        run: |
          cd atlas-ui
          npm ci
          npm run build
