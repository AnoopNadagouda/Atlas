server:
  port: 0

spring:
  application:
    name: atlas-memory-service-test
  datasource:
    url: jdbc:h2:mem:memorytestdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  data:
    redis:
      repositories:
        enabled: false
  kafka:
    bootstrap-servers: localhost:9092

atlas:
  memory:
    embedding-model: test-model
    embedding-dimension: 384
    default-decay-rate: 0.05
    consolidation-interval-ms: 3600000
    importance-threshold: 0.3
